name: Build and compatibility tests

on:
  push:
    branches: [main, mc/1.20.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae-all-pattern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and release JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit test, and verify release contents
        run: ./gradlew clean check build --stacktrace
      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: ae-all-pattern-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ github.run_id }}
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  amplifying-cycles:
    name: Amplifying cycles · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: recipe recognition and rejection
            task: testAmplifyingCycleCompiler
          - name: demand planning and resources
            task: testAmplifyingCyclePlanning
          - name: AE adapter policy gate
            task: testAmplifyingCycleAdapter
          - name: defaults migration and persistence codec
            task: testAmplifyingCyclePolicy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ${{ matrix.name }} tests
        run: ./gradlew ${{ matrix.task }} --stacktrace
      - name: Upload amplifying-cycle failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amplifying-cycles-${{ matrix.task }}-${{ github.run_id }}
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  viewer-unit-tests:
    name: ${{ matrix.name }} scanner unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JEI
            task: testJeiIntegration
            properties: >-
              -Pruntime_jei=true -Pruntime_emi=false -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
          - name: EMI-TMRV
            task: testEmiIntegration
            properties: >-
              -Pruntime_jei=false -Pruntime_emi=true -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ${{ matrix.name }}-specific scanner tests
        run: ./gradlew ${{ matrix.task }} ${{ matrix.properties }} --stacktrace
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.name }}-failure-${{ github.run_id }}
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  client-smoke:
    name: Client startup · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JEI
            properties: >-
              -Pclient_smoke_test=true -Pruntime_jei=true -Pruntime_emi=false
              -Pruntime_mekanism=false -Pruntime_mystical_agriculture=false
              -Pruntime_create=false -Pruntime_industrial_foregoing=false
              -Pruntime_neoecoae=false -Pruntime_ae_provider_addons=false
              -Pruntime_packaged_addons=false -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=jei
          - name: EMI-TMRV
            properties: >-
              -Pclient_smoke_test=true -Pruntime_jei=false -Pruntime_emi=true
              -Pruntime_mekanism=false -Pruntime_mystical_agriculture=false
              -Pruntime_create=false -Pruntime_industrial_foregoing=false
              -Pruntime_neoecoae=false -Pruntime_ae_provider_addons=false
              -Pruntime_packaged_addons=false -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=emi,toomanyrecipeviewers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the real client and exit after the title screen
        run: xvfb-run --auto-servernum ./gradlew runClient ${{ matrix.properties }} --stacktrace
      - name: Verify smoke-test completion marker
        run: grep -F 'CLIENT_SMOKE_TEST_PASSED' run/logs/latest.log
      - name: Upload client failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.name }}-failure-${{ github.run_id }}
          path: |
            run/logs/**
            run/crash-reports/**
          if-no-files-found: ignore

  gametest:
    name: No-GUI GameTest · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal-AE2
            properties: >-
              -Pruntime_jei=false -Pruntime_emi=false -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=aeallpattern,ae2
              -Pforbidden_test_mods=jei,emi,toomanyrecipeviewers,mekanism,appmek,create,industrialforegoing,mysticalagriculture,neoecoae,expatternprovider,extendedae_plus,advanced_ae,ae2cs,ae2lt,packagedauto
          - name: JEI-only
            properties: >-
              -Pruntime_jei=true -Pruntime_emi=false -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=jei
              -Pforbidden_test_mods=emi,toomanyrecipeviewers
          - name: EMI-TMRV-only
            properties: >-
              -Pruntime_jei=false -Pruntime_emi=true -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=emi,toomanyrecipeviewers
          - name: Mekanism-JEI
            properties: >-
              -Pruntime_jei=true -Pruntime_emi=false -Pruntime_mekanism=true
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=jei,mekanism,appmek
              -Pforbidden_test_mods=emi,toomanyrecipeviewers
          - name: Mekanism-EMI-TMRV
            properties: >-
              -Pruntime_jei=false -Pruntime_emi=true -Pruntime_mekanism=true
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=emi,toomanyrecipeviewers,mekanism,appmek
          - name: Mekanism-factory-addons
            properties: >-
              -Pruntime_jei=true -Pruntime_emi=false -Pruntime_mekanism=true
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=true
              -Pexpected_test_mods=jei,mekanism,appmek,mekmm,mekanism_extras
              -Pforbidden_test_mods=emi,toomanyrecipeviewers
          - name: showcase-tech-JEI
            properties: >-
              -Pruntime_jei=true -Pruntime_emi=false -Pruntime_mekanism=true
              -Pruntime_mystical_agriculture=true -Pruntime_create=true
              -Pruntime_industrial_foregoing=true -Pruntime_neoecoae=true
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=jei,mekanism,appmek,create,industrialforegoing,mysticalagriculture,neoecoae
              -Pforbidden_test_mods=emi,toomanyrecipeviewers
          - name: AE-provider-addons
            properties: >-
              -Pruntime_jei=false -Pruntime_emi=false -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=true -Pruntime_packaged_addons=false
              -Pruntime_mekanism_addons=false
              -Pruntime_extendedae_plus=false
              -Pexpected_test_mods=expatternprovider,advanced_ae,ae2cs,ae2lt,thunderbolt,glodium,geckolib,ae2addonlib
              -Pforbidden_test_mods=jei,emi,toomanyrecipeviewers
          - name: ExtendedAE-Plus
            properties: >-
              -Pruntime_jei=false -Pruntime_emi=false -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_extendedae_plus=true
              -Pruntime_packaged_addons=false -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=expatternprovider,extendedae_plus,glodium
              -Pforbidden_test_mods=jei,emi,toomanyrecipeviewers,advanced_ae,ae2cs,ae2lt
          - name: PackagedAuto-ExtendedCrafting
            properties: >-
              -Pruntime_jei=false -Pruntime_emi=false -Pruntime_mekanism=false
              -Pruntime_mystical_agriculture=false -Pruntime_create=false
              -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
              -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=true
              -Pruntime_mekanism_addons=false
              -Pexpected_test_mods=packagedauto,packagedexcrafting,extendedcrafting,cucumber
              -Pforbidden_test_mods=jei,emi,toomanyrecipeviewers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download profile mods and run the no-GUI game server
        run: ./gradlew runGameTestServer ${{ matrix.properties }} --stacktrace
      - name: Confirm that all required GameTests ran
        run: grep -F 'All 55 required tests passed :)' run-gametest/logs/latest.log
      - name: Upload GameTest failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-${{ matrix.name }}-failure-${{ github.run_id }}
          path: |
            run-gametest/logs/**
            run-gametest/crash-reports/**
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  restart-persistence:
    name: Save reopen · aggregate pattern remains craftable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create and save the aggregate-pattern fixture
        run: >-
          ./gradlew runGameTestServer --stacktrace
          -Pgametest_directory=run-gametest-restart
          -Ppersistence_phase=seed
          -Pruntime_jei=false -Pruntime_emi=false -Pruntime_mekanism=false
          -Pruntime_mystical_agriculture=false -Pruntime_create=false
          -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
          -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
          -Pruntime_mekanism_addons=false
          -Pexpected_test_mods=aeallpattern,ae2
      - name: Confirm that the seed phase really ran
        run: grep -F 'PERSISTENCE_RESTART_SEED_PASSED' run-gametest-restart/logs/latest.log
      - name: Reopen the same save in a fresh game process
        run: >-
          ./gradlew runGameTestServer --stacktrace
          -Pgametest_directory=run-gametest-restart
          -Ppersistence_phase=verify
          -Pruntime_jei=false -Pruntime_emi=false -Pruntime_mekanism=false
          -Pruntime_mystical_agriculture=false -Pruntime_create=false
          -Pruntime_industrial_foregoing=false -Pruntime_neoecoae=false
          -Pruntime_ae_provider_addons=false -Pruntime_packaged_addons=false
          -Pruntime_mekanism_addons=false
          -Pexpected_test_mods=aeallpattern,ae2
      - name: Confirm that the reopened save retained a craftable pattern
        run: grep -F 'PERSISTENCE_RESTART_VERIFY_PASSED' run-gametest-restart/logs/latest.log
      - name: Upload restart-test failure logs and save
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restart-persistence-failure-${{ github.run_id }}
          path: |
            run-gametest-restart/logs/**
            run-gametest-restart/crash-reports/**
            run-gametest-restart/world/**
          if-no-files-found: ignore
