plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.modularity.inferModulePath = false

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://modmaven.dev/' }
    maven { url = 'https://maven.blamejared.com' }
    // The public endpoint redirects binary artifacts into /releases. Pointing
    // Gradle there directly avoids resolving only the POM without the mod JAR.
    maven { url = 'https://maven.blakesmods.com/releases' }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    validateAccessTransformers = true

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            def stressItemCount = providers.gradleProperty('stress_item_count')
            if (stressItemCount.isPresent()) {
                systemProperty 'aeallpattern.stressItemCount', stressItemCount.get()
            }
            if (providers.gradleProperty('client_smoke_test')
                    .map { it.toBoolean() }
                    .getOrElse(false)) {
                systemProperty 'aeallpattern.clientSmokeTest', 'true'
                systemProperty 'aeallpattern.expectedTestMods',
                        providers.gradleProperty('expected_test_mods').getOrElse('')
            }
            if (providers.gradleProperty('showcase_quickplay')
                    .map { it.toBoolean() }
                    .getOrElse(false)) {
                programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
            }
            def quickplayWorld = providers.gradleProperty('quickplay_world')
            if (quickplayWorld.isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', quickplayWorld.get()
            } else if (providers.gradleProperty('showcase_singleplayer')
                    .map { it.toBoolean() }
                    .getOrElse(false)) {
                programArguments.addAll '--quickPlaySingleplayer', 'AE全样板_纯净演示场_0.1.6'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            def serverWorld = providers.gradleProperty('server_world')
            if (serverWorld.isPresent()) {
                programArguments.addAll '--universe', 'saves', '--world', serverWorld.get()
            }
        }

        gameTestServer {
            type = 'gameTestServer'
            programArgument '--nogui'
            // Keep dependency-matrix tests away from the playable lab save. A
            // minimal run intentionally omits optional block registries and
            // would otherwise replace those machines with air when saving.
            gameDirectory = file(providers.gradleProperty('gametest_directory')
                    .getOrElse('run-gametest'))
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'aeallpattern.expectedTestMods',
                    providers.gradleProperty('expected_test_mods').getOrElse('')
            systemProperty 'aeallpattern.forbiddenTestMods',
                    providers.gradleProperty('forbidden_test_mods').getOrElse('')
            systemProperty 'aeallpattern.persistencePhase',
                    providers.gradleProperty('persistence_phase').getOrElse('')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, 'aeallpattern.refmap.json'
    config 'aeallpattern.mixins.json'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(layout.buildDirectory.dir('generated/resources/gameTest'))
}

// Forge 1.20.1 discovers resource-pack namespaces from the first physical root in
// MOD_CLASSES. Keep classes and resources together so assets/data are visible in dev runs.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile

tasks.named('compileJava').configure {
    // processResources synchronizes this shared directory; compile classes only after that cleanup.
    dependsOn(tasks.named('processResources'))
}

def generateGameTestTemplate = tasks.register('generateGameTestTemplate') {
    def outputFile = layout.buildDirectory.file(
            'generated/resources/gameTest/data/aeallpattern/structures/empty.nbt')
    outputs.file(outputFile)
    doLast {
        def encoded = ''
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.bytes = Base64.decoder.decode(encoded)
    }
}

tasks.named('processResources').configure {
    dependsOn(generateGameTestTemplate)
}

// ModDev keeps the Minecraft/Forge classpath scoped to the main source set.
// Persistence codec tests need the same mapped classes without launching a game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

configurations {
    runtimeClasspath.extendsFrom modRuntimeOnly
}

dependencies {
    // AE2 is required and supplies the public crafting-provider API.
    modImplementation "appeng:appliedenergistics2-forge:${ae2_version}"
    modImplementation "org.appliedenergistics:guideme:${guideme_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    implementation "io.github.llamalad7:mixinextras-forge:0.4.1"

    // Optional client recipe-viewer bridges. EMI + TMRV replace the JEI runtime,
    // but still expose JEI integrations to the scanner through TMRV.
    compileOnly "maven.modrinth:emi:${emi_version}"
    compileOnly "maven.modrinth:yFypjcfd:${tmrv_version}"
    modCompileOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    modRuntimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"

    // Mekanism is optional. Keep its classes out of common signatures and load adapters conditionally.
    modCompileOnly "mekanism:Mekanism:${mekanism_version}:api"
    if (project.property('runtime_mekanism').toBoolean()) {
        modRuntimeOnly "mekanism:Mekanism:${mekanism_version}:all"
    }

    // JEI is optional and client-only. The server recipe index must not depend on it.
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    if (project.property('runtime_emi').toBoolean()) {
        modRuntimeOnly "maven.modrinth:emi:${emi_version}"
        modRuntimeOnly "maven.modrinth:yFypjcfd:${tmrv_version}"
    } else if (project.property('runtime_jei').toBoolean()) {
        modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    }

    // AE2 15 includes its JEI bridge. Applied Mekanistics extends that bridge
    // with Mekanism chemical keys and owns their transport logic.
    modCompileOnly "maven.modrinth:applied-mekanistics:${applied_mekanistics_version}"
    if ((project.property('runtime_jei').toBoolean()
            || project.property('runtime_emi').toBoolean())
            && project.property('runtime_mekanism').toBoolean()) {
        modRuntimeOnly "maven.modrinth:applied-mekanistics:${applied_mekanistics_version}"
    }

    // Runtime-only generic JEI compatibility fixture. No Mystical Agriculture
    // classes are referenced by the implementation.
    if (project.property('runtime_mystical_agriculture').toBoolean()) {
        // Their published POMs contain no packaging metadata, so request the
        // binary artifacts explicitly for the development runtime fixture.
        modRuntimeOnly "com.blakebr0.cucumber:Cucumber:${cucumber_version}@jar"
        modRuntimeOnly "com.blakebr0.mysticalagriculture:MysticalAgriculture:${mystical_agriculture_version}@jar"
    }

    // Large-tech fixtures used by the video showcase. They remain runtime-only:
    // aggregate scanning must keep working through JEI without linking their APIs.
    if (project.property('runtime_create').toBoolean()) {
        modRuntimeOnly "maven.modrinth:LNytGWDc:8amzvn9x"
    }
    if (project.property('runtime_industrial_foregoing').toBoolean()) {
        modRuntimeOnly "maven.modrinth:1Ro7m06l:LMqbm4db"
        modRuntimeOnly "maven.modrinth:lWxpUd04:5XXYqEMK"
    }
    if (project.property('runtime_neoecoae').toBoolean()) {
        // Neo ECO 20.4.2 is built against the Forge 1.20.1 LDLib line. Keep both runtime-only:
        // the optional compatibility mixin is selected by mod id at launch.
        modRuntimeOnly "maven.modrinth:B1CBVXHX:NzNZILgs"
        // 20.4.x declares two overloaded CraftingService mixin targets that
        // Mixin 0.8.5 cannot disambiguate on Forge 1.20.1. 20.3.0 uses the
        // AE2 15.4.10 signature and still contains the crafting-pattern bus.
        modRuntimeOnly "maven.modrinth:udZtKfzP:TYrXvWwv"
    }

    // Optional AE provider compatibility fixture. These are real Forge 1.20.1
    // releases, pinned so CI detects upstream class/mixin drift instead of
    // silently skipping provider tests when an addon is absent.
    if (project.property('runtime_ae_provider_addons').toBoolean()) {
        modRuntimeOnly "maven.modrinth:UhW5uCKw:eoUaDkZf"
        modRuntimeOnly "maven.modrinth:8BmcQJ2H:aC5KMoNg"
        modRuntimeOnly "maven.modrinth:JiOqfoFM:uq3lO4ER"
        modRuntimeOnly "maven.modrinth:rxYaglEe:d83Wdhdn"
        modRuntimeOnly "maven.modrinth:uJ9afomy:VGhHOKsP"
        modRuntimeOnly "maven.modrinth:M5jhzZXH:bdl88uT0"
        modRuntimeOnly "maven.modrinth:ArHeh5Fz:mpt9LSEi"
    }
    // ExtendedAE Plus 1.6.x requires ExtendedAE 1.4.6 or newer. Keep this
    // profile on that declared compatibility baseline. Plus 1.6.2 added a
    // lifecycle mixin that targets a method absent from every 1.20 ExtendedAE
    // binary; 1.6.1-f1 contains the same supported matrix APIs without it.
    if (project.property('runtime_extendedae_plus').toBoolean()) {
        modRuntimeOnly "maven.modrinth:UhW5uCKw:eoUaDkZf"
        modRuntimeOnly "curse.maven:ex-pattern-provider-892005:7005572"
        modRuntimeOnly "maven.modrinth:xr109llC:3sniosWU"
    }

    // Packaging integration fixture: PackagedAuto + Extended Crafting bridge.
    if (project.property('runtime_packaged_addons').toBoolean()) {
        modRuntimeOnly "com.blakebr0.cucumber:Cucumber:${cucumber_version}@jar"
        modRuntimeOnly "maven.modrinth:5JMG1gql:NtEZsGjO"
        modRuntimeOnly "maven.modrinth:ugIdhQx4:JlONTeuu"
        modRuntimeOnly "maven.modrinth:qO33ACjS:OFILEfwe"
    }

    // Mekanism factory addons are tested separately from base Mekanism so a
    // broken addon alias cannot hide inside the broad full-runtime job.
    if (project.property('runtime_mekanism_addons').toBoolean()) {
        modRuntimeOnly "maven.modrinth:qDJXZJTz:PQ3IlR98"
        modRuntimeOnly "curse.maven:mekanism-extras-1026040:6936409"
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def registerTaggedTest = { String taskName, List<String> tags ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Runs tests tagged ${tags.join('/')}"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags(tags as String[])
        }
    }
}

registerTaggedTest('testJeiIntegration', ['jei', 'recipe-viewer'])
registerTaggedTest('testEmiIntegration', ['emi', 'recipe-viewer'])
registerTaggedTest('testAmplifyingCycleCompiler', ['amplifying-cycle-compiler'])
registerTaggedTest('testAmplifyingCyclePlanning', ['amplifying-cycle-planning'])
registerTaggedTest('testAmplifyingCycleAdapter', ['amplifying-cycle-adapter'])
registerTaggedTest('testAmplifyingCyclePolicy', ['amplifying-cycle-policy'])

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('NOTICE.md')) {
        into 'META-INF'
    }
    from(rootProject.file('third_party/thunderbolt-core/LICENSE')) {
        into 'META-INF/licenses'
        rename { 'routing-engine-LGPL-3.0.txt' }
    }
    manifest {
        attributes(
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': mod_authors,
                'Automatic-Module-Name': mod_group_id,
                'MixinConfigs': 'aeallpattern.mixins.json',
        )
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_version            : mod_version,
            ae2_version_range      : ae2_version_range,
            mekanism_version_range : mekanism_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

def releaseVersion = providers.gradleProperty('mod_version')
def generatedMetadataFile = layout.buildDirectory.file(
        'generated/sources/modMetadata/META-INF/mods.toml')
def readmeFile = layout.projectDirectory.file('README.md')

def verifyReleaseMetadata = tasks.register('verifyReleaseMetadata') {
    dependsOn(generateModMetadata)
    inputs.property('releaseVersion', releaseVersion)
    inputs.file('gradle.properties')
    inputs.file(readmeFile)
    inputs.file('src/main/templates/META-INF/mods.toml')
    doLast {
        def expectedVersion = releaseVersion.get()
        if (expectedVersion.endsWith('-dev')) {
            throw new GradleException('Release version must not use the -dev suffix')
        }
        def metadata = generatedMetadataFile.get().asFile.text
        if (!metadata.contains("version=\"${expectedVersion}\"")) {
            throw new GradleException('Generated mod metadata does not match the project version')
        }
        if (!readmeFile.asFile.text.contains(expectedVersion)) {
            throw new GradleException('README compatibility table must contain the release version')
        }
    }
}

def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    dependsOn(tasks.named('jar'))
    inputs.file(releaseJar)
    doLast {
        def archive = releaseJar.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def names = zip.entries().collect { it.name } as Set
            for (required in [
                    'META-INF/mods.toml',
                    'META-INF/LICENSE',
                    'META-INF/NOTICE.md',
                    'META-INF/licenses/routing-engine-LGPL-3.0.txt',
                    'icon.png',
                    'assets/aeallpattern/textures/item/pattern_binder.png',
                    'assets/aeallpattern/textures/block/pattern_linker.png',
                    'assets/aeallpattern/textures/block/tianshu/tianshu_pattern_selector.png',
                    'assets/aeallpattern/models/block/tianshu_pattern_selector.json']) {
                if (!names.contains(required)) {
                    throw new GradleException("Release JAR is missing ${required}")
                }
            }
            if (names.contains('META-INF/jarjar/metadata.json')
                    || names.any { it.startsWith('META-INF/jarjar/') }) {
                throw new GradleException('Release JAR must not contain nested mods')
            }
            if (names.any { it.startsWith('com/moakiee/thunderbolt/') }) {
                throw new GradleException('Release JAR must not expose the upstream Thunderbolt package')
            }
            if (names.any { it.startsWith('appeng/') || it.startsWith('mekanism/') || it.startsWith('mezz/jei/') }) {
                throw new GradleException('Release JAR unexpectedly contains upstream classes')
            }
            def metadataEntry = zip.getEntry('META-INF/mods.toml')
            def metadata = zip.getInputStream(metadataEntry).getText('UTF-8')
            if (metadata =~ /(?i)modId\s*=\s*"thunderbolt"/) {
                throw new GradleException('Release JAR must not require or declare Thunderbolt')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn(verifyReleaseMetadata, verifyReleaseJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Optional integration mixins deliberately target mods that are not on the
    // normal compile classpath. Runtime plugin checks still gate every target.
    options.compilerArgs += ['-AdisableTargetValidator=true']
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
