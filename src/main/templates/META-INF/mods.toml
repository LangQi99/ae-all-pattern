modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/LangQi99/ae-all-pattern/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/LangQi99/ae-all-pattern"
authors="${mod_authors}"
credits="${mod_credits}"
logoFile="icon.png"
description='''
Bind a supported machine once and expose its deterministic recipes to AE2 as virtual processing patterns, without storing thousands of encoded pattern items.

绑定一次受支持的机器，即可把确定性配方作为虚拟处理样板发布到 AE2 网络，无需存放成千上万张实体编码样板。
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=true
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
mandatory=false
versionRange="${mekanism_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15.0.0,16.0.0)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="appmek"
mandatory=false
versionRange="[1.4.3,2.0.0)"
ordering="AFTER"
side="BOTH"
