modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/LangQi99/ae-all-pattern/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/LangQi99/ae-all-pattern"
authors="${mod_authors}"
credits="${mod_credits}"
logoFile="icon.png"
description='''
Bind a supported machine once and expose its deterministic recipes to AE2 as virtual processing patterns, without storing thousands of encoded pattern items.

绑定一次受支持的机器，即可把确定性配方作为虚拟处理样板发布到 AE2 网络，无需存放成千上万张实体编码样板。
'''

[[mixins]]
config="aeallpattern.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
reason="AE All Pattern publishes virtual processing patterns to an AE network."
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
type="optional"
reason="Enables Mekanism machine adapters."
versionRange="${mekanism_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="guideme"
type="required"
reason="Provides the in-game AE All Pattern guide."
versionRange="[21.1.1,22.0.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
reason="Provides universal recipe discovery for aggregate patterns."
versionRange="[19.19,20)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ae2jeiintegration"
type="optional"
reason="Converts JEI ingredient types into AE generic stack keys."
versionRange="[1.2.0,2)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="appmek"
type="optional"
reason="Adds AE chemical keys used by Mekanism gas and chemical aggregate patterns."
versionRange="[1.6.0,2)"
ordering="AFTER"
side="BOTH"
